services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            AI_SERVICE_URL: 'http://ai:8000'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            ai:
                condition: service_healthy
    ai:
        build:
            context: ./ai
            dockerfile: '${AI_DOCKERFILE:-Dockerfile}'
        image: 'crossinspect/ai'
        environment:
            OMP_NUM_THREADS: '${AI_OMP_NUM_THREADS:-4}'
            MKL_NUM_THREADS: '${AI_OMP_NUM_THREADS:-4}'
        ports:
            # Hanya untuk debugging langsung; Laravel memanggil via http://ai:8000
            - '${AI_PORT:-8001}:8000'
        volumes:
            # Hot-reload saat development. Hapus baris ini untuk build produksi.
            - './ai/app:/srv/ai/app:ro'
            # Cache bobot model supaya tidak re-download tiap `docker compose up`.
            - 'ai-hf-cache:/srv/ai/.cache/huggingface'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    ai-hf-cache:
        driver: local
